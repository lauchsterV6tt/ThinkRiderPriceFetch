[project]
name = "thinkriderscraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M B", email = "mailthecookiemonster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.17.0",
]

# Never build or install this package (no editable wheel, no .pth trouble).
# It runs directly from the source tree:
#   uv run python src/thinkriderscraper/__init__.py
[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
